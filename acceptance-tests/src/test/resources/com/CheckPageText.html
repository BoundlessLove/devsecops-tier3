<html xmlns:concordion="http://www.concordion.org/2007/concordion">
<body>

<h1>Check that URL contains a specific phrase."</h1>

<p>
    TEST 1: We expect that URL call 
    <span concordion:set="#url">getTestUrl()</span> will return content containing the phrase "
    <span concordion:set="#text">Hello from aks-demo running on k3d!</span>".
</p>

<p concordion:assertTrue="urlContainsText(#url, #text)">
    <i>The page contains the phrase.</i>
</p>

</body>
</html>
