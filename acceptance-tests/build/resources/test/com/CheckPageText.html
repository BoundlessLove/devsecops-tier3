<html xmlns:concordion="http://www.concordion.org/2007/concordion">
<body>

<h1>Check that URL contains the phrase "Google offered in:"</h1>

<p>
    TEST 1: We expect that URL call 
    <span concordion:set="#url">https://www.google.com</span>
    will return content containing the phrase "
    <span concordion:set="#text">Google offered in:</span>".
</p>

<p concordion:assertTrue="urlContainsText(#url, #text)">
    <i>The page contains the phrase.</i>
</p>

</body>
</html>
